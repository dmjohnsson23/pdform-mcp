[project]
name = "pdform-mcp"
version = "0.2.0"
description = "Tools for LLMs to inspect and understand PDFs on a deep structural level"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13.5",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
]

[project.scripts]
pdform-mcp = "pdform_mcp:main"

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
